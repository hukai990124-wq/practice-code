<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>荳ｪ莠ｺ邂莉・/title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f1f5f9;
            color: #1e293b;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }

        .profile {
            width: min(100% - 40px, 420px);
            padding: 32px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 32px rgb(15 23 42 / 10%);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .intro {
            margin: 0 0 24px;
            color: #64748b;
        }

        dl {
            display: grid;
            grid-template-columns: 100px 1fr;
            gap: 14px 12px;
            margin: 0;
        }

        dt {
            color: #64748b;
        }

        dd {
            margin: 0;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main class="profile" id="profile"></main>
    <script src="javascriptpractice.js"></script>
</body>
