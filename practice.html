<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
        body {
            margin: 0;
            padding: 32px;
            font-family: Arial, sans-serif;
        }

        .page-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 24px 0;
        }

        .section-divider {
            max-width: 800px;
            margin: 0 auto;
            border: 0;
            border-top: 1px solid #999;
        }

        #pet {
            width: 600px;
            max-width: 100%;
            height: 400px;
        }

        @media (max-width: 600px) {
            body { padding: 16px; }
            #pet { height: 320px; }
        }
    </style>

        <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
             }
        }
        </script>  
        <script type="module" src="javascriptpractice.js"></script>
    </head>  
<body>
    <main>
        <section class="page-section profile-section" aria-label="个人简介">
            <div class="profile" id="profile"></div>
        </section>

        <hr class="section-divider">

        <section class="page-section pet-section" aria-labelledby="pet-title">
            <h2 id="pet-title">Web Pet</h2>
            <div id="pet"></div>
            <button id="feed">feed</button>
            <p id="pet-message">Click the pet!</p>
        </section>
    </main>

    


</body>
</html>
