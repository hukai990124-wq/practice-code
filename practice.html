<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Pet · Draco</title>
    <link rel="stylesheet" href="practice.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="javascriptpractice.js"></script>
</head>
<body>
    <main>
        <section class="page-section pet-section" aria-labelledby="pet-title">
            <div class="pet-heading">
                <div>
                    <p class="pet-kicker">INTERACTIVE COMPANION</p>
                    <h2 id="pet-title">Web Pet</h2>
                </div>
                <dl class="pet-details">
                    <div><dt>Pet Name</dt><dd>Draco</dd></div>
                    <div><dt>Age</dt><dd>500</dd></div>
                </dl>
            </div>
            <div id="pet"></div>
            <p class="interaction-hint">Drag to rotate · Right-drag to move · Scroll to zoom</p>
            <div class="pet-footer">
                <button id="feed" type="button">Feed Draco</button>
                <p id="pet-message" aria-live="polite">Draco is ready to meet you.</p>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <span>© 2026 @HuKai · 保留所有权利</span>
        <span class="footer-crest" aria-hidden="true">
            <img src="./sigilHK.png" alt="">
        </span>
    </footer>
</body>
</html>
